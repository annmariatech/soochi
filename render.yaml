services:
  - type: web
    name: soochi-api
    runtime: python
    branch: main
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SOOCHI_ENV
        value: production
      - key: SOOCHI_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: soochi-db
          property: connectionString
      - key: SOOCHI_CORS_ORIGINS
        fromService:
          type: web
          name: soochi-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SOOCHI_MEDIA_DIR
        value: data/generated_media

  - type: web
    name: soochi-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: soochi-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: soochi-db
    databaseName: soochi
    user: soochi
    region: singapore
    plan: free
